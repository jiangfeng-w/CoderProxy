[project]
name = "coderproxy-relay"
version = "0.1.0"
description = "CoderProxy relay：把牛码模型以 OpenAI 兼容 API 暴露给任意 agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["app*", "relay*"]
exclude = ["tests*", "_deps*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
